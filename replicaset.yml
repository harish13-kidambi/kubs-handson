apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-nginx
  labels:
    env: demo
spec:
  replicas: 4
  selector:
    matchLabels:
      env: demo
  template:
    metadata:
      labels:
        env: demo
        name: nginx-pod
    spec:
      containers:
      - name: nginx
        image: nginx:latest